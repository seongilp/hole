<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hole Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7385; --line:#e3e6ec;
          --accent:#2f6fed; --block:#d64545; --ok:#2e9e5b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --fg:#e7eaf0; --muted:#8a93a6; --line:#2a303b;
            --accent:#6b9bff; --block:#ff6b6b; --ok:#4cc38a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .tile .label { color:var(--muted); font-size:12px; }
  .tile .value { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  h2 { font-size:14px; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .domain { word-break:break-all; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .pill.blocked { color:var(--block); border-color:var(--block); }
  .pill.cached, .pill.forwarded { color:var(--ok); border-color:var(--ok); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg);
           padding:6px 12px; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--block); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                  background:var(--bg); color:var(--fg); }
  input[type=text] { flex:1; min-width:160px; }
  .status { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--block); }
  #toast { position:fixed; bottom:16px; right:16px; padding:10px 14px; border-radius:8px;
           background:var(--fg); color:var(--bg); display:none; }
  .muted { color:var(--muted); font-size:12px; }
  .log { max-height:420px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>🕳️ Hole</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="state">…</span></span>
  <button id="toggle">…</button>
  <button id="refresh">목록 갱신</button>
</header>
<main>
  <section class="tiles">
    <div class="card tile"><div class="label">전체 쿼리</div><div class="value" id="t-total">–</div></div>
    <div class="card tile"><div class="label">차단</div><div class="value" id="t-blocked">–</div></div>
    <div class="card tile"><div class="label">차단 비율</div><div class="value" id="t-pct">–</div></div>
    <div class="card tile"><div class="label">캐시 응답</div><div class="value" id="t-cached">–</div></div>
    <div class="card tile"><div class="label">차단 도메인 수</div><div class="value" id="t-domains">–</div></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>많이 차단된 도메인</h2><table id="top-blocked"></table></div>
    <div class="card"><h2>많이 조회된 도메인</h2><table id="top-allowed"></table></div>
    <div class="card"><h2>클라이언트</h2><table id="top-clients"></table></div>
    <div class="card">
      <h2>사용자 규칙</h2>
      <form id="rule-form">
        <select id="rule-kind"><option value="deny">차단</option><option value="allow">허용</option></select>
        <input type="text" id="rule-domain" placeholder="example.com" required>
        <button class="primary" type="submit">추가</button>
      </form>
      <table id="rules"></table>
    </div>
  </section>

  <section class="card">
    <h2>최근 쿼리</h2>
    <div class="log"><table id="queries"></table></div>
    <p class="muted" id="meta"></p>
  </section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
