<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hole Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7385; --line:#e3e6ec;
          --accent:#2f6fed; --block:#d64545; --ok:#2e9e5b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --fg:#e7eaf0; --muted:#8a93a6; --line:#2a303b;
            --accent:#6b9bff; --block:#ff6b6b; --ok:#4cc38a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .tile .label { color:var(--muted); font-size:12px; }
  .tile .value { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; align-items:start; }
  /* Korean labels must not break per character in narrow cells. */
  th, button, select, .pill { white-space:nowrap; }
  .compact-ends td:first-child, .compact-ends th:first-child,
  .compact-ends td:last-child, .compact-ends th:last-child { width:1%; white-space:nowrap; }
  #rule-form { margin-bottom:8px; }
  .top th:last-child { text-align:right; }
  /* Query log scrolls sideways on phones instead of crushing the domain column. */
  #queries { min-width:700px; }
  td.action { width:1%; text-align:right; padding-left:8px; }
  button.small { padding:2px 10px; font-size:12px; }
  main > *, .grid3 > * { min-width:0; } /* let wide tables scroll inside their card */
  @media (max-width: 600px) {
    .tiles { grid-template-columns:repeat(2, 1fr); }
    .tile:last-child:nth-child(odd) { grid-column:1 / -1; }
  }
  .empty { color:var(--muted); font-size:13px; padding:8px 4px; }
  h2 { font-size:14px; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .domain { overflow-wrap:anywhere; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .pill.blocked { color:var(--block); border-color:var(--block); }
  .pill.cached, .pill.forwarded { color:var(--ok); border-color:var(--ok); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg);
           padding:6px 12px; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--block); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                  background:var(--bg); color:var(--fg); }
  input[type=text] { flex:1; min-width:160px; }
  .status { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--block); }
  #toast { position:fixed; bottom:16px; right:16px; padding:10px 14px; border-radius:8px;
           background:var(--fg); color:var(--bg); display:none; }
  .muted { color:var(--muted); font-size:12px; }
  .log { max-height:420px; overflow:auto; }
  .test-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .test-head h2 { margin:0; flex:1; }
  #test-summary { font-size:15px; font-weight:600; margin:4px 0; }
  #test-summary.good { color:var(--ok); } #test-summary.bad { color:var(--block); }
  .pill.pass { color:var(--block); border-color:var(--block); }
  .pill.stopped { color:var(--ok); border-color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>🕳️ Hole</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="state">…</span></span>
  <button id="toggle">…</button>
  <button id="refresh">목록 갱신</button>
</header>
<main>
  <section class="tiles">
    <div class="card tile"><div class="label">전체 쿼리</div><div class="value" id="t-total">–</div></div>
    <div class="card tile"><div class="label">차단</div><div class="value" id="t-blocked">–</div></div>
    <div class="card tile"><div class="label">차단 비율</div><div class="value" id="t-pct">–</div></div>
    <div class="card tile"><div class="label">캐시 응답</div><div class="value" id="t-cached">–</div></div>
    <div class="card tile"><div class="label">차단 도메인 수</div><div class="value" id="t-domains">–</div></div>
  </section>

  <section class="card">
    <div class="test-head">
      <h2>브라우저 차단 테스트</h2>
      <button id="run-test" class="primary">다시 테스트</button>
    </div>
    <p id="test-summary">테스트 중…</p>
    <p id="test-hint" class="muted"></p>
    <div class="log"><table id="test-results" class="compact-ends"></table></div>
    <p class="muted">이 브라우저에서 광고·추적 서버에 실제로 접속해 봅니다. 브라우저 확장이 막은 것도 차단으로 표시됩니다.</p>
  </section>

  <section class="grid3">
    <div class="card"><h2>많이 차단된 도메인</h2><table id="top-blocked" class="top"></table></div>
    <div class="card"><h2>많이 조회된 도메인</h2><table id="top-allowed" class="top"></table></div>
    <div class="card"><h2>클라이언트</h2><table id="top-clients" class="top"></table></div>
  </section>

  <section class="card">
    <h2>사용자 규칙</h2>
    <form id="rule-form">
      <select id="rule-kind"><option value="deny">차단</option><option value="allow">허용</option></select>
      <input type="text" id="rule-domain" placeholder="example.com" required>
      <button class="primary" type="submit">추가</button>
    </form>
    <table id="rules" class="compact-ends"></table>
  </section>

  <section class="card">
    <h2>최근 쿼리</h2>
    <div class="log"><table id="queries"></table></div>
    <p class="muted" id="meta"></p>
  </section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
